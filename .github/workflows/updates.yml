name: update-dates
on:
  push:
    branches: [main]
    paths-ignore: ['updates.json']
  schedule:
    - cron: '0 0 * * *'   # 每天檢查一次外部頁面是否有更新（UTC 00:00＝台灣 08:00）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: node .github/scripts/build-updates.js
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git diff --cached --quiet || (git commit -m "自動更新首頁卡片日期" && git push)

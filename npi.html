.plan-card[id^=ncard-]{scroll-margin-top:72px}
.npi-flash{animation:npiflash 1.4s ease}

.npi-price-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.npi-hl{list-style:none;padding:0;margin:0}
.npi-hl li{position:relative;padding:5px 0 5px 18px;font-size:13.5px;line-height:1.55}

.npi-box{background:var(--light);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin:10px 0}
.npi-box-title{font-size:12px;font-weight:700;color:var(--gray);margin-bottom:6px}
.npi-quote{border-left:3px solid var(--blue);padding:8px 12px;font-size:13.5px;color:var(--text);background:var(--blue-bg);border-radius:0 8px 8px 0;margin:8px 0}
.npi-qa{border-bottom:1px solid var(--light);padding:10px 0}
.npi-qa:last-child{border-bottom:none}
.npi-qa .q{font-size:13.5px;font-weight:700;margin-bottom:4px}
.npi-qa .a-ok{font-size:13px;color:var(--green);margin-bottom:2px}
.npi-qa .a-no{font-size:13px;color:var(--red)}
.npi-mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
.section-tag{font-size:11px;font-weight:700;color:var(--gray);margin:2px 0 10px;letter-spacing:.3px}
.npi-sched{background:var(--white);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:6px 16px 10px;margin-bottom:14px}
.npi-sched-grp .section-tag{margin:12px 0 4px}
.npi-sched-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--light);border-radius:8px;font-size:13.5px;cursor:pointer}
.npi-sched-row:last-child{border-bottom:none}
.npi-sched-row:hover{background:var(--blue-bg)}
.npi-sched-row .s-name{font-weight:700}
.npi-sched-row .s-date{font-size:12px;color:var(--gray);text-align:right}
.npi-sched-row .s-go{color:var(--blue);font-weight:700}
.npi-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;border-bottom:1.5px solid var(--border);padding-bottom:10px}
.npi-tab{padding:7px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--white);font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;font-family:inherit}
.npi-tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.npi-panel{display:none}
.npi-panel.on{display:block}
.npi-row{display:grid;grid-template-columns:128px minmax(0,1fr);gap:4px 14px;padding:9px 0;border-bottom:1px solid var(--light);font-size:13.5px;line-height:1.6}
.npi-row:last-child{border-bottom:none}
.npi-row .k{font-weight:700;color:var(--gray);font-size:12.5px;padding-top:1px}
.npi-row.warn{background:var(--orange-bg);border-radius:8px;padding:9px 10px;margin:4px 0;border-bottom:none}
.npi-row.warn .k{color:var(--orange)}
@media(max-width:700px){
  .npi-sched-row{grid-template-columns:70px minmax(0,1fr) 14px}
  .npi-sched-row .s-date{grid-column:2 / 4;text-align:left}
  .npi-row{grid-template-columns:1fr}
}
</style>

  return {text:'即將預購', cls:'badge-blue'};

function toggleNpi(key){
  const body = document.getElementById('nbody-' + key);
  const tog  = document.getElementById('ntog-' + key);
  if(body.style.display === 'none'){
    body.style.display = 'block';
    tog.textContent = '▲';
  } else {
    body.style.display = 'none';
    tog.textContent = '▼';
  }
}

function openNpi(key){
  const body = document.getElementById('nbody-' + key);
  const tog  = document.getElementById('ntog-' + key);
  if(!body) return null;
  body.style.display = 'block';
  tog.textContent = '▲';
  return document.getElementById('ncard-' + key);
}

function gotoNpi(keys){
  const cards = keys.map(openNpi).filter(Boolean);
  if(!cards.length) return;
  cards[0].scrollIntoView({behavior:'smooth', block:'start'});
  cards.forEach(c => { c.classList.remove('npi-flash'); void c.offsetWidth; c.classList.add('npi-flash'); });
  history.replaceState(null, '', '#' + keys[0]);
}

}

// 排序：未發售的在前（依發售日由近到遠）→ 已發售的在後（最近發售的在前）→ 台灣未上市（沒填 launch）最後；同組維持上方陣列原順序
function npiSortedTimeline(){
  const now = new Date(); now.setHours(0,0,0,0);
  const d = s => { const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd).getTime(); };
  const grp = t => !t.launch ? 2 : (now >= d(t.launch) ? 1 : 0);
  return NPI_TIMELINE.map((t,i) => ({t,i}))
    .sort((a,b) => {
      const ga = grp(a.t), gb = grp(b.t);
      if(ga !== gb) return ga - gb;
      if(ga === 0) return d(a.t.launch) - d(b.t.launch) || a.i - b.i;
      if(ga === 1) return d(b.t.launch) - d(a.t.launch) || a.i - b.i;
      return a.i - b.i;
    }).map(x => x.t);
}
function npiSortedProducts(sortedTl){
  const order = {}; let n = 0;
  sortedTl.forEach(t => t.keys.forEach(k => { order[k] = n++; }));
  return NPI_PRODUCTS.map((p,i) => ({p,i}))
    .sort((a,b) => (order[a.p.key] ?? 999) - (order[b.p.key] ?? 999) || a.i - b.i).map(x => x.p);
}

function npiRows(items){
  // 「<b>標題：</b>內容」拆成左右兩欄；標題含 ⚠️ 的整列標橘底
  return items.map(h => {
    const m = h.match(/^<b>([\s\S]*?)<\/b>([\s\S]*)$/);
    if(!m) return `<div class="npi-row" style="grid-template-columns:1fr">${h}</div>`;
    const k = m[1].replace(/[：:]\s*$/, '');
    return `<div class="npi-row${k.includes('⚠️') ? ' warn' : ''}"><div class="k">${k}</div><div>${m[2]}</div></div>`;
  }).join('');
}

function npiPanels(p){
  const panels = [];
  if(p.highlights) panels.push({label:'重點規格', html: npiRows(p.highlights)});
  let fit = '';
  if(p.prosCons) fit += `<div class="npi-box"><div class="npi-box-title">優點</div>${p.prosCons.pros}</div><div class="npi-box"><div class="npi-box-title">缺點／限制</div>${p.prosCons.cons}</div>`;
  if(p.audience) fit += `<div class="npi-box"><div class="npi-box-title">適合族群</div>${p.audience}</div>`;
  if(p.upgrade) fit += `<div class="npi-box"><div class="npi-box-title">換機評估建議</div>${npiRows(p.upgrade.map(u => /^<b>/.test(u) ? u : '<b>建議</b>' + u))}</div>`;
  if(fit) panels.push({label:'適合誰・換機建議', html: fit});
  let talk = '';
  if(p.quotes) talk += `<div class="npi-box"><div class="npi-box-title">對客話術／提醒</div>${p.quotes.map(q => `<div class="npi-quote">${q}</div>`).join('')}</div>`;
  if(p.extraBody === 'aperture') talk += `<div class="section-tag" style="margin-top:14px">可變光圈｜門市話術</div>${apertureTalkBody()}`;
  if(p.body === 'duoqa') talk += `<div class="section-tag" style="margin-top:14px">客人常見疑問應對（可以講 vs 不要保證）</div>${duoQaBody()}`;
  if(talk) panels.push({label:'話術・提醒', html: talk});
  if(p.images){
    const imgs = p.images.map((im, idx) => {
      const id = `${p.key}-${idx}`;
      return `
        <div class="plan-card" style="margin-bottom:8px">
          <div class="plan-hdr" onclick="toggleNpiImg('${id}')">
            <span class="plan-label" style="font-size:13px">${im.label}</span>
            <span class="plan-toggle" id="nimg-tog-${id}">▼</span>
          </div>
          <div class="plan-body" id="nimg-body-${id}" style="display:none">
            <img src="${im.img}" style="width:100%;display:block" loading="lazy">
          </div>
        </div>`;
    }).join('');
    panels.push({label: p.imagesTitle || '配色速查', html: imgs});
  }
  return panels;
}

function npiTab(key, i){
  document.querySelectorAll(`#nbody-${key} .npi-tab`).forEach((t, n) => t.classList.toggle('on', n === i));

}

    {title:'未發售／預購中', items: sortedTl.filter(t => t.launch && npiStatus(t).text !== '已發售')},
    {title:'已發售', items: sortedTl.filter(t => t.launch && npiStatus(t).text === '已發售')},
    {title:'台灣未上市', items: sortedTl.filter(t => !t.launch)},
  ].filter(g => g.items.length);
  const timeline = `<div class="npi-sched">` + groups.map(g => `
    <div class="npi-sched-grp">
      <div class="section-tag">${g.title}</div>
      ${g.items.map(t => `
        <div class="npi-sched-row" data-keys="${t.keys.join(',')}" onclick='gotoNpi(${JSON.stringify(t.keys)})'>
          <span class="badge ${npiStatus(t).cls}" style="justify-self:start">${npiStatus(t).text}</span>
          <span class="s-name">${t.name}</span>
          <span class="s-date">${t.date}</span>
          <span class="s-go">▸</span>
        </div>`).join('')}
    </div>`).join('') + `</div>`;

  const cards = npiSortedProducts(sortedTl).map(p => {
    const priceBadges = (p.prices || []).map(pr => `<span class="badge badge-blue">${pr}</span>`).join('');
    const dateBadge = p.date ? `<span class="badge badge-orange">${p.date}</span>` : '';
    const st = NPI_STATUS_BY_KEY[p.key];
    const statusBadge = st ? `<span class="badge ${st.cls}">${st.text}</span>` : '';
    const tagBadge = p.tag ? `<span class="badge badge-green">${p.tag}</span>` : '';

    const panels = npiPanels(p);
    const bodyHtml = (panels.length > 1
      ? `<div class="npi-tabs">${panels.map((pn, i) => `<button class="npi-tab${i === 0 ? ' on' : ''}" onclick="npiTab('${p.key}',${i})">${pn.label}</button>`).join('')}</div>`
      : '') + panels.map((pn, i) => `<div class="npi-panel${i === 0 ? ' on' : ''}">${pn.html}</div>`).join('');

    return `
      <div class="plan-card" id="ncard-${p.key}">
        <div class="plan-hdr" onclick="toggleNpi('${p.key}')">
          <div>
            <span class="plan-label">${p.icon} ${p.name}</span>
            <div class="npi-price-row">${statusBadge}${priceBadges}${dateBadge}${tagBadge}</div>
          </div>
          <span class="plan-toggle" id="ntog-${p.key}">▼</span>
        </div>
        <div class="plan-body" id="nbody-${p.key}" style="display:none;padding:16px 20px">
          ${bodyHtml}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('mc').innerHTML = `
    <div class="sec-hdr">
      <div>
        <div class="sec-title">2026 Apple 秋季發表會・新品快學</div>
        <div class="sec-sub">「智慧個人中心」主題發表 · 涵蓋 18 Pro系列／AW S12＆Ultra 4／AirPods 5／Mac mini M6＆M5 Pro／HomePod mini 2／Apple TV 4K 第 4 代／HomeView／Home Collection／iPhone Duo／MacBook Pro 14吋 M6／iMac M6／iPad mini 8／MacBook Pro PROLED XDR</div>
      </div>
    </div>
    <div class="card" style="padding:14px 18px;margin-bottom:12px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input id="npi-q" type="search" placeholder="搜尋關鍵字：產品、功能、話術…（如 摺痕、可變光圈、eSIM）" autocomplete="off"
          style="flex:1;min-width:200px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:16px;font-family:inherit;outline:none;background:var(--light)"
          oninput="onNpiSearch(this.value)">
        <button onclick="document.getElementById('npi-q').value='';onNpiSearch('')" style="padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:13px;cursor:pointer;font-family:inherit;color:var(--gray)">清除</button>
      </div>
      <div id="npi-count" style="font-size:12px;color:var(--gray);font-weight:600;margin-top:8px;display:none"></div>
    </div>
    <div class="section-tag">發售時程（點一下跳到該產品）</div>
    ${timeline}
    <div class="section-tag">產品詳細</div>
    ${cards}
  `;
}

// ── 搜尋：多個詞用空格隔開都要符合；符合的卡片自動展開並標示關鍵字，清除後把自動展開的收回去 ──
let npiTimer, npiAutoOpened = new Set();
function onNpiSearch(v){ clearTimeout(npiTimer); npiTimer = setTimeout(() => npiSearch(v), 200); }
function npiClearMarks(root){
  root.querySelectorAll('mark.npi-mark').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  root.normalize();
}
function npiMark(root, terms){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while((n = walker.nextNode())) nodes.push(n);
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  nodes.forEach(node => {
    if(!node.nodeValue.trim() || !re.test(node.nodeValue)) { re.lastIndex = 0; return; }
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    node.nodeValue.split(re).forEach((part, i) => {
      if(i % 2){ const m = document.createElement('mark'); m.className = 'npi-mark'; m.textContent = part; frag.appendChild(m); }
      else if(part) frag.appendChild(document.createTextNode(part));
    });
    node.replaceWith(frag);
  });
}
function npiSearch(v){
  const terms = v.toLowerCase().split(/\s+/).filter(Boolean);
  const cards = [...document.querySelectorAll('.plan-card[id^=ncard-]')];
  const countEl = document.getElementById('npi-count');
  cards.forEach(c => npiClearMarks(c));
  // 把上一輪自動展開的先收回去（使用者自己展開的不動）
  npiAutoOpened.forEach(key => {
    document.getElementById('nbody-' + key).style.display = 'none';
    document.getElementById('ntog-' + key).textContent = '▼';
  });
  npiAutoOpened = new Set();
  if(!terms.length){
    cards.forEach(c => c.style.display = '');
    document.querySelectorAll('.npi-sched-row, .npi-sched-grp').forEach(t => t.style.display = '');
    countEl.style.display = 'none';
    return;
  }
  const shown = new Set();
  cards.forEach(c => {
    const key = c.id.replace('ncard-', '');
    const text = c.textContent.toLowerCase();
    const hit = terms.every(t => text.includes(t));
    c.style.display = hit ? '' : 'none';
    if(hit){
      shown.add(key);
      const body = document.getElementById('nbody-' + key);
      if(body.style.display === 'none'){ body.style.display = 'block'; document.getElementById('ntog-' + key).textContent = '▲'; npiAutoOpened.add(key); }
      // 配色圖片折疊區不展開，只標示文字
      npiMark(c, terms);
      // 目前分頁沒有命中時，切到第一個有命中的分頁
      const panels = [...c.querySelectorAll('.npi-panel')];
      if(panels.length > 1 && !panels.some(pn => pn.classList.contains('on') && pn.querySelector('mark.npi-mark'))){
        const i = panels.findIndex(pn => pn.querySelector('mark.npi-mark'));
        if(i >= 0) npiTab(key, i);
      }
    }
  });
  document.querySelectorAll('.npi-sched-row').forEach(t => {
    t.style.display = t.dataset.keys.split(',').some(k => shown.has(k)) ? '' : 'none';
  });
  document.querySelectorAll('.npi-sched-grp').forEach(g => {
    g.style.display = [...g.querySelectorAll('.npi-sched-row')].some(r => r.style.display !== 'none') ? '' : 'none';
  });
  countEl.style.display = 'block';
  countEl.textContent = shown.size ? `找到 ${shown.size} 張符合的產品卡片` : '找不到符合的內容';
}

renderNpi();
if(location.hash.length > 1){ setTimeout(() => gotoNpi([decodeURIComponent(location.hash.slice(1))]), 50); }
</script>

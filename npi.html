.npi-timeline{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}

.npi-time-item .t-name{font-size:13px;font-weight:700;margin-bottom:6px}
.npi-time-item .t-date{font-size:12px;color:var(--gray)}
.npi-time-link{cursor:pointer;transition:box-shadow .15s,transform .15s}
.npi-time-link:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);transform:translateY(-1px)}
.npi-time-item .t-go{font-size:11.5px;color:var(--blue);margin-top:6px;font-weight:600}
.plan-card[id^=ncard-]{scroll-margin-top:72px}
.npi-flash{animation:npiflash 1.4s ease}
@keyframes npiflash{0%,60%{box-shadow:0 0 0 3px var(--blue)}100%{box-shadow:none}}
.npi-price-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.npi-hl{list-style:none;padding:0;margin:0}
.npi-hl li{position:relative;padding:5px 0 5px 18px;font-size:13.5px;line-height:1.55}
.npi-hl li::before{content:'●';position:absolute;left:0;top:5px;color:var(--blue);font-size:8px}
.npi-box{background:var(--light);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin:10px 0}
.npi-box-title{font-size:12px;font-weight:700;color:var(--gray);margin-bottom:6px}
.npi-quote{border-left:3px solid var(--blue);padding:8px 12px;font-size:13.5px;color:var(--text);background:var(--blue-bg);border-radius:0 8px 8px 0;margin:8px 0}
.npi-qa{border-bottom:1px solid var(--light);padding:10px 0}
.npi-qa:last-child{border-bottom:none}
.npi-qa .q{font-size:13.5px;font-weight:700;margin-bottom:4px}
.npi-qa .a-ok{font-size:13px;color:var(--green);margin-bottom:2px}
.npi-qa .a-no{font-size:13px;color:var(--red)}
.section-tag{font-size:11px;font-weight:700;color:var(--gray);margin:2px 0 10px;letter-spacing:.3px}

function toggleNpi(key){
  const body = document.getElementById('nbody-' + key);
  const tog  = document.getElementById('ntog-' + key);
  if(body.style.display === 'none'){
    body.style.display = 'block';
    tog.textContent = '▲';
  } else {
    body.style.display = 'none';
    tog.textContent = '▼';
  }
}

function openNpi(key){
  const body = document.getElementById('nbody-' + key);
  const tog  = document.getElementById('ntog-' + key);
  if(!body) return null;
  body.style.display = 'block';
  tog.textContent = '▲';
  return document.getElementById('ncard-' + key);
}

function gotoNpi(keys){
  const cards = keys.map(openNpi).filter(Boolean);
  if(!cards.length) return;
  cards[0].scrollIntoView({behavior:'smooth', block:'start'});
  cards.forEach(c => { c.classList.remove('npi-flash'); void c.offsetWidth; c.classList.add('npi-flash'); });
  history.replaceState(null, '', '#' + keys[0]);
}

function toggleNpiImg(id){
  const body = document.getElementById('nimg-body-' + id);
  const tog  = document.getElementById('nimg-tog-' + id);
  if(body.style.display === 'none'){
    body.style.display = 'block';
    tog.textContent = '▲';
  } else {
    body.style.display = 'none';
    tog.textContent = '▼';
  }
}

function renderNpi(){
  const timeline = NPI_TIMELINE.map(t => `

      <div class="t-date">${t.date}</div>
      <div class="t-go">點擊查看 ▸</div>

  `).join('');

  const cards = NPI_PRODUCTS.map(p => {
    const priceBadges = (p.prices || []).map(pr => `<span class="badge badge-blue">${pr}</span>`).join('');
    const dateBadge = p.date ? `<span class="badge badge-orange">${p.date}</span>` : '';
    const tagBadge = p.tag ? `<span class="badge badge-green">${p.tag}</span>` : '';

    let bodyHtml = '';
    {
      if (p.highlights) {
        bodyHtml += `<ul class="npi-hl">${p.highlights.map(h => `<li>${h}</li>`).join('')}</ul>`;
      }
      if (p.prosCons) {
        bodyHtml += `
          <div class="npi-box">
            <div class="npi-box-title">優點</div>${p.prosCons.pros}
          </div>
          <div class="npi-box">
            <div class="npi-box-title">缺點／限制</div>${p.prosCons.cons}
          </div>`;
      }
      if (p.audience) {
        bodyHtml += `<div class="npi-box"><div class="npi-box-title">適合族群</div>${p.audience}</div>`;
      }
      if (p.upgrade) {
        bodyHtml += `<div class="npi-box"><div class="npi-box-title">換機評估建議</div><ul class="npi-hl">${p.upgrade.map(u => `<li>${u}</li>`).join('')}</ul></div>`;
      }
      if (p.quotes) {
        bodyHtml += `<div class="npi-box"><div class="npi-box-title">對客話術／提醒</div>${p.quotes.map(q => `<div class="npi-quote">${q}</div>`).join('')}</div>`;
      }
      if (p.extraBody === 'aperture') {
        bodyHtml += `<div class="section-tag" style="margin-top:14px">可變光圈｜門市話術</div>${apertureTalkBody()}`;
      }
      if (p.body === 'duoqa') {
        bodyHtml += `<div class="section-tag" style="margin-top:14px">客人常見疑問應對（可以講 vs 不要保證）</div>${duoQaBody()}`;
      }
      if (p.images) {
        bodyHtml += `<div class="section-tag" style="margin-top:14px">配色速查</div>`;
        bodyHtml += p.images.map((im, idx) => {
          const id = `${p.key}-${idx}`;
          return `
            <div class="plan-card" style="margin-bottom:8px">
              <div class="plan-hdr" onclick="toggleNpiImg('${id}')">
                <span class="plan-label" style="font-size:13px">${im.label}</span>
                <span class="plan-toggle" id="nimg-tog-${id}">▼</span>
              </div>
              <div class="plan-body" id="nimg-body-${id}" style="display:none">
                <img src="${im.img}" style="width:100%;display:block" loading="lazy">
              </div>
            </div>
          `;
        }).join('');
      }
    }

    return `
      <div class="plan-card" id="ncard-${p.key}">
        <div class="plan-hdr" onclick="toggleNpi('${p.key}')">
          <div>
            <span class="plan-label">${p.icon} ${p.name}</span>
            <div class="npi-price-row">${priceBadges}${dateBadge}${tagBadge}</div>
          </div>
          <span class="plan-toggle" id="ntog-${p.key}">▼</span>
        </div>
        <div class="plan-body" id="nbody-${p.key}" style="display:none;padding:16px 20px">
          ${bodyHtml}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('mc').innerHTML = `
    <div class="sec-hdr">
      <div>
        <div class="sec-title">2026 Apple 秋季發表會・新品快學</div>
        <div class="sec-sub">「智慧個人中心」主題發表 · 涵蓋 18 Pro系列／AW S12＆Ultra 4／AirPods 5／Mac mini M6＆M5 Pro／HomePod mini 2／Apple TV 4K 第 4 代／HomeView／Home Collection／iPhone Duo · 最後更新：2026-10-15</div>
      </div>
    </div>
    <div class="npi-timeline">${timeline}</div>
    ${cards}
  `;
}

if(location.hash.length > 1){ setTimeout(() => gotoNpi([decodeURIComponent(location.hash.slice(1))]), 50); }

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>展示機規範</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <span class="hdr-logo"></span>
    <div>
      <div class="hdr-title">展示機規範</div>
      <div class="hdr-sub">Apple Specialist Store · Three Table Shop</div>
    </div>
  </div>
  <a href="index.html" class="hdr-date" style="text-decoration:none">← 工具箱首頁</a>
</div>

<div class="main" id="mc"></div>

<script>
// 以「展示機品項」為單位分類（取代舊版依裝置大類分類），每筆對應 PDF 內特定頁碼區間
const SECURITY_ITEMS = [
  {
    key: 'mac-laptop',
    name: 'MacBook Pro · MacBook Air · MacBook Neo',
    sub: 'Lite Security · Laptop（p4）',
    img: 'security-img/mac-laptop.jpg',
  },
  {
    key: 'mac-desktop',
    name: 'iMac · Studio Display · Mac Studio · Mac mini',
    sub: 'Lite Security · iMac / Studio Display（p5）· Mac Studio / Mac mini（p6）· Magic 配件（p7）',
    img: 'security-img/mac-desktop.jpg',
  },
  {
    key: 'ipad-mini',
    name: 'iPad mini',
    sub: 'Lite Security · iPad mini（p29）· Apple Pencil（p30）',
    img: 'security-img/ipad-mini.jpg',
  },
  // ── 在此繼續新增其他展示機品項 ──
];

function toggleSecurity(key){
  const body = document.getElementById('sbody-' + key);
  const tog  = document.getElementById('stog-' + key);
  if(body.style.display === 'none'){
    body.style.display = 'block';
    tog.textContent = '▲';
  } else {
    body.style.display = 'none';
    tog.textContent = '▼';
  }
}

function renderSecurity(){
  const cards = SECURITY_ITEMS.map(item => `
    <div class="plan-card">
      <div class="plan-hdr" onclick="toggleSecurity('${item.key}')">
        <div>
          <span class="plan-label">${item.name}</span>
          <div style="font-size:12px;color:var(--gray);margin-top:2px">${item.sub}</div>
        </div>
        <span class="plan-toggle" id="stog-${item.key}">▼</span>
      </div>
      <div class="plan-body" id="sbody-${item.key}" style="display:none">
        <img src="${item.img}" style="width:100%;display:block" loading="lazy">
      </div>
    </div>
  `).join('');

  document.getElementById('mc').innerHTML = `
    <div class="sec-hdr">
      <div>
        <div class="sec-title">展示機規範</div>
        <div class="sec-sub">Apple Branded Programs Security Guidelines · 依品項分類 · 最後更新：2026-11-04</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="card-title"><span class="card-title-icon" style="background:var(--red-bg)">📄</span>完整文件</div>
      <a class="file-card" href="https://drive.google.com/file/d/1OkTYTohbd5NubHgbgq5E4NhBD7xb_fup/view?usp=sharing" target="_blank">
        <span class="file-icon">🔒</span>
        <div class="file-info">
          <div class="file-name">Apple Branded Programs_Security Guidelines_102826.pdf</div>
          <div class="file-desc">Google Drive · 點擊下載完整版 · 編號 102826</div>
        </div>
        <span class="file-size">↗ 開啟</span>
      </a>
      <a class="file-card" href="https://drive.google.com/file/d/1d_49rKSen2djeYs6fxckb--TRsffAnr_/view?usp=sharing" target="_blank" style="margin-top:8px">
        <span class="file-icon">🏷️</span>
        <div class="file-info">
          <div class="file-name">FY26Q4_GC iPhone Planograms_Multi-brand_090926 TW only.pdf</div>
          <div class="file-desc">精簡價格牌規範</div>
        </div>
        <span class="file-size">↗ 開啟</span>
      </a>
    </div>
    ${cards}
  `;
}

renderSecurity();
</script>
</body>
</html>

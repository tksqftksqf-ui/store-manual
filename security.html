<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>展示機規範</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <span class="hdr-logo"></span>
    <div>
      <div class="hdr-title">展示機規範</div>
      <div class="hdr-sub">Apple Specialist Store · Three Table Shop</div>
    </div>
  </div>
  <a href="index.html" class="hdr-date" style="text-decoration:none">← 工具箱首頁</a>
</div>

<div class="main" id="mc"></div>

<script>
// 以「展示機品項」為單位分類（取代舊版依裝置大類分類），每筆對應 PDF 內特定頁碼區間
const SECURITY_ITEMS = [
  {
    key: 'magsafe-dock',
    name: 'MagSafe iPhone Display Dock',
    sub: 'Lite Security · Swap / Update（p14–18）',
    img: 'security-img/magsafe-dock.jpg',
  },
  {
    key: 'aw-touch-try',
    name: 'Apple Watch Touch & Try Display',
    sub: 'Lite Security · Swap / Removal / Silicone Cover（p44–49）',
    img: 'security-img/aw-touch-try.jpg',
  },
  // ── 在此繼續新增其他展示機品項 ──
];

function toggleSecurity(key){
  const body = document.getElementById('sbody-' + key);
  const tog  = document.getElementById('stog-' + key);
  if(body.style.display === 'none'){
    body.style.display = 'block';
    tog.textContent = '▲';
  } else {
    body.style.display = 'none';
    tog.textContent = '▼';
  }
}

function renderSecurity(){
  const cards = SECURITY_ITEMS.map(item => `
    <div class="plan-card">
      <div class="plan-hdr" onclick="toggleSecurity('${item.key}')">
        <div>
          <span class="plan-label">${item.name}</span>
          <div style="font-size:12px;color:var(--gray);margin-top:2px">${item.sub}</div>
        </div>
        <span class="plan-toggle" id="stog-${item.key}">▼</span>
      </div>
      <div class="plan-body" id="sbody-${item.key}" style="display:none">
        <img src="${item.img}" style="width:100%;display:block" loading="lazy">
      </div>
    </div>
  `).join('');

  document.getElementById('mc').innerHTML = `
    <div class="sec-hdr">
      <div>
        <div class="sec-title">展示機規範</div>
        <div class="sec-sub">Apple Branded Programs Security Guidelines · 依品項分類 · 最後更新：2026-09-16</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="card-title"><span class="card-title-icon" style="background:var(--red-bg)">📄</span>完整文件</div>
      <a class="file-card" href="https://drive.google.com/file/d/1qwqiWPgRL60-OKJ8aNhjdz4yJGcf2AY-/view?usp=drive_link" target="_blank">
        <span class="file-icon">🔒</span>
        <div class="file-info">
          <div class="file-name">Apple Branded Programs_Security Guidelines_090926.pdf</div>
          <div class="file-desc">Google Drive · 點擊下載完整版（需有存取權限）</div>
        </div>
        <span class="file-size">↗ 開啟</span>
      </a>
    </div>
    ${cards}
  `;
}

renderSecurity();
</script>
</body>
</html>

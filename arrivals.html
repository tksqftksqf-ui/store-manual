<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>近期到貨</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <span class="hdr-logo"></span>
    <div>
      <div class="hdr-title">近期到貨</div>
      <div class="hdr-sub">Apple Specialist Store · Three Table Shop</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="hdr-updated">9/24–9/30 季末不出貨</div>
    <a href="index.html" class="hdr-date" style="text-decoration:none">← 工具箱首頁</a>
  </div>
</div>

<div class="main" id="mc"></div>

<script src="shared/products.js?v=20261015v1"></script>
<script src="shared/arrivals-data.js?v=20261018v1"></script>
<script>
let arrivalQuery = '';
let arrivalCat = 'all';
let arrivalSeries = 'all';
let arrivalSub = 'all';
// 容量＝規格裡最後一個 GB/TB（與檔期活動查詢頁相同規則）
function getCap(p){ const m = p.spec.match(/(\d+(?:GB|TB))(?!.*\d+(?:GB|TB))/); return m ? m[1] : null; }
// 從檔期活動查詢點貨號進來（?pid=）：只看「同機型＋同容量」的到貨選項
let arrivalFocus = null;
(function(){
  const pid = new URLSearchParams(location.search).get('pid');
  const prod = pid && PRODUCTS.find(x => x.pid === pid);
  if(prod && ARRIVALS.some(a => a.pid === pid)) arrivalFocus = {pid, name: prod.name, cap: getCap(prod)};
})();
function clearArrivalFocus(){
  arrivalFocus = null;
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  updateArrivalResults();
}

// 系列順序比照「檔期活動查詢」，iPhone 16e 雖在該頁隱藏，但到貨頁有貨所以保留（排最後）
const ARR_SERIES_ORDER = {
  'Mac': ['MacBook Neo','MacBook Air','MacBook Pro','Mac mini','iMac','Mac Studio'],
  'iPad': ['iPad mini','iPad A16','iPad Air','iPad Pro'],
  'iPhone': ['iPhone Duo','iPhone 18 Pro','iPhone 18 Pro Max','iPhone 17 Pro','iPhone 17 Pro Max','iPhone 17','iPhone 17e','iPhone Air','iPhone 16e'],
  'Watch': ['Apple Watch SE3','Apple Watch S11','Apple Watch S12','Apple Watch Ultra 3','Apple Watch Ultra 4'],
};
function arrSeriesOf(a){
  const n = a.name;
  if(a.cat==='Mac'){
    if(n.startsWith('MacBook Air')) return 'MacBook Air';
    if(n.startsWith('MacBook Pro')) return 'MacBook Pro';
    if(n.startsWith('MacBook Neo')) return 'MacBook Neo';
    if(n.startsWith('Mac Mini')) return 'Mac mini';
    if(n.startsWith('Mac Studio')) return 'Mac Studio';
    if(n.startsWith('iMac')) return 'iMac';
  }
  if(a.cat==='iPad'){
    if(n.startsWith('iPad mini')) return 'iPad mini';
    if(n.startsWith('iPad A16')) return 'iPad A16';
    if(n.startsWith('iPad Pro')) return 'iPad Pro';
    if(n.startsWith('iPad Air')) return 'iPad Air';
  }
  if(a.cat==='iPhone'){
    if(n.startsWith('iPhone 17e')) return 'iPhone 17e';
    if(n.startsWith('iPhone 17 Pro Max')) return 'iPhone 17 Pro Max';
    if(n.startsWith('iPhone 17 Pro')) return 'iPhone 17 Pro';
    if(n.startsWith('iPhone 17')) return 'iPhone 17';
    if(n.startsWith('iPhone Air')) return 'iPhone Air';
    if(n.startsWith('iPhone 16e')) return 'iPhone 16e';
    if(n.startsWith('iPhone 18 Pro Max')) return 'iPhone 18 Pro Max';
    if(n.startsWith('iPhone 18 Pro')) return 'iPhone 18 Pro';
    if(n.startsWith('iPhone Duo')) return 'iPhone Duo';
  }
  if(a.cat==='Watch'){
    if(n.includes('SE3')) return 'Apple Watch SE3';
    if(n.includes('Ultra 4')) return 'Apple Watch Ultra 4';
    if(n.includes('Ultra 3')) return 'Apple Watch Ultra 3';
    if(n.includes('S12')) return 'Apple Watch S12';
    if(n.includes('S11')) return 'Apple Watch S11';
  }
  return null;
}
// 第 2 層：系列（只列這次有到貨的系列）
function arrSeriesOptions(){
  const order = ARR_SERIES_ORDER[arrivalCat];
  if(!order) return null;
  const have = new Set(ARRIVALS.filter(a=>a.cat===arrivalCat).map(arrSeriesOf));
  return order.filter(x => have.has(x));
}
// 第 3 層：該系列底下的品名（配件沒有系列，直接列品名）
function arrSubOptions(){
  if(arrivalCat==='all') return null;
  const so = arrSeriesOptions();
  if(so && so.length >= 2 && arrivalSeries === 'all') return null; // 先選系列，品項選項才展開
  const seen = new Set(), out = [];
  for(const a of ARRIVALS){
    if(a.cat!==arrivalCat) continue;
    if(arrivalSeries!=='all' && arrSeriesOf(a)!==arrivalSeries) continue;
    if(!seen.has(a.name)){ seen.add(a.name); out.push(a.name); }
  }
  return out;
}
function arrMenuBtn(label, on, onclick){
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.style.cssText = `padding:4px 12px;border-radius:16px;border:1.5px solid ${on?'var(--blue)':'var(--border)'};background:${on?'var(--blue-bg)':'var(--white)'};color:${on?'var(--blue)':'var(--gray)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .13s`;
  btn.addEventListener('click', onclick);
  return btn;
}
function renderArrivalSeriesMenu(){
  const el = document.getElementById('arr-series-row');
  if(!el) return;
  const list = arrSeriesOptions();
  el.innerHTML = '';
  if(!list || list.length < 2){ el.style.display = 'none'; if(arrivalSeries!=='all') arrivalSeries='all'; return; }
  el.style.display = 'flex';
  for(const x of ['all', ...list]) el.appendChild(arrMenuBtn(x==='all'?'全部系列':x, x===arrivalSeries, () => selectArrivalSeries(x)));
}
function renderArrivalSubMenu(){
  const el = document.getElementById('arr-sub-row');
  if(!el) return;
  const list = arrSubOptions();
  el.innerHTML = '';
  if(!list || list.length < 2){ el.style.display = 'none'; if(arrivalSub!=='all') arrivalSub='all'; return; }
  el.style.display = 'flex';
  for(const x of ['all', ...list]) el.appendChild(arrMenuBtn(x==='all'?'全部品項':x, x===arrivalSub, () => selectArrivalSub(x)));
}
function selectArrivalCat(c){
  arrivalCat = c; arrivalSeries = 'all'; arrivalSub = 'all';
  document.querySelectorAll('.arr-cat-btn').forEach(b => {
    const on = b.dataset.cat === c;
    b.style.borderColor = on ? 'var(--blue)' : 'var(--border)';
    b.style.background  = on ? 'var(--blue)' : 'var(--white)';
    b.style.color       = on ? '#fff' : 'var(--gray)';
  });
  renderArrivalSeriesMenu(); renderArrivalSubMenu(); updateArrivalResults();
}
function selectArrivalSeries(x){
  arrivalSeries = x; arrivalSub = 'all';
  renderArrivalSeriesMenu(); renderArrivalSubMenu(); updateArrivalResults();
}
function selectArrivalSub(x){
  arrivalSub = x;
  renderArrivalSubMenu(); updateArrivalResults();
}

function renderArrivals(){
  document.getElementById('mc').innerHTML = `
    <div class="sec-hdr"><div>
      <div class="sec-title">近期到貨 <span style="font-size:15px;font-weight:700;color:var(--blue);background:var(--blue-bg);padding:2px 10px;border-radius:8px;margin-left:8px">1013</span></div>
      <div class="sec-sub">共 ${ARRIVALS.length} 筆 &nbsp;·&nbsp; <span style="color:var(--green);font-weight:700">●</span> 有到貨 &nbsp;<span style="color:var(--orange);font-weight:700">●</span> 少量</div>
    </div></div>
    <div class="card" style="padding:16px 20px">
      <input id="arr-search" type="text" placeholder="搜尋關鍵字…（如 iPhone、MacBook Air、267371）"
        style="width:100%;max-width:480px;padding:.45em .8em;border:1px solid var(--border);border-radius:6px;font-size:.95em;box-sizing:border-box;outline:none"
        value="${arrivalQuery}"
        oninput="arrivalQuery=this.value;updateArrivalResults()">
      <div style="margin-top:.6em;display:flex;flex-wrap:wrap;gap:.4em">
        ${['all','Mac','iPad','iPhone','Watch','配件'].map(c=>`<button
          data-cat="${c}"
          onclick="selectArrivalCat('${c}')"
          class="arr-cat-btn"
          style="padding:.3em .75em;font-size:.8em;border:1px solid ${c===arrivalCat?'var(--blue)':'var(--border)'};border-radius:20px;background:${c===arrivalCat?'var(--blue)':'var(--white)'};color:${c===arrivalCat?'#fff':'var(--gray)'};cursor:pointer;white-space:nowrap">
          ${c==='all'?'全部類別':c}
        </button>`).join('')}
      </div>
      <div id="arr-series-row" style="display:none;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)"></div>
      <div id="arr-sub-row" style="display:none;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)"></div>
    </div>
    <div id="arrival-results"></div>`;
  updateArrivalResults();
}

function updateArrivalResults(){
  const filtered = ARRIVALS.filter(a => {
    if(arrivalCat !== 'all' && a.cat !== arrivalCat) return false;
    if(arrivalSeries !== 'all' && arrSeriesOf(a) !== arrivalSeries) return false;
    if(arrivalSub !== 'all' && a.name !== arrivalSub) return false;
    if(arrivalFocus){
      const pr = PRODUCTS.find(x => x.pid === a.pid);
      if((pr ? pr.name : a.name) !== arrivalFocus.name || (pr ? getCap(pr) : null) !== arrivalFocus.cap) return false;
    }
    if(!arrivalQuery) return true;
    const q = arrivalQuery.toLowerCase();
    const prod = PRODUCTS.find(x => x.pid === a.pid);
    const name = prod ? `${prod.name} ${prod.color||''} ${prod.spec||''}` : a.name;
    return [a.pid, a.mpn, name, a.cat].some(v => v.toLowerCase().includes(q));
  });

  const el = document.getElementById('arrival-results');
  if(!el) return;

  const focusBar = arrivalFocus ? `<div style="padding:12px 16px;background:var(--green-bg);border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--green);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <span>📦 檔期活動查詢帶入：${arrivalFocus.name}${arrivalFocus.cap ? ' · '+arrivalFocus.cap : ''}，只顯示同機型同容量的到貨選項</span>
      <button onclick="clearArrivalFocus()" style="padding:4px 12px;border-radius:16px;border:1.5px solid var(--green);background:var(--white);color:var(--green);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">顯示全部到貨</button>
    </div>` : '';

  if(filtered.length === 0){
    el.innerHTML = `${focusBar}<div style="padding:12px 16px;background:var(--light);border-bottom:1px solid var(--border);font-size:12px;color:var(--gray);font-weight:600">找到 <span style="color:var(--text)">0</span> 筆結果</div><div class="empty">找不到符合的商品</div>`;
    return;
  }

  const catCls = c => c==='Mac'?'badge-blue':c==='iPad'?'badge-orange':c==='iPhone'?'badge-green':'badge-gray';
  function qtyCell(n, label){
    if(!n) return `<td data-label="${label}" style="padding:10px 14px;text-align:center;color:var(--border)">—</td>`;
    const s = n>=50?'color:var(--green);font-weight:800':n>=10?'color:var(--green);font-weight:700':'color:var(--orange);font-weight:700';
    return `<td data-label="${label}" style="padding:10px 14px;text-align:center;font-size:15px;${s}">${n.toLocaleString()}</td>`;
  }

  let rows = '';
  let prevGroup = null;
  for(const a of filtered){
    const prod = PRODUCTS.find(x => x.pid === a.pid);
    const groupName = prod ? prod.name : a.name;
    const detail = prod
      ? [prod.color, prod.spec].filter(Boolean).join(' · ')
      : a.mpn;
    if(groupName !== prevGroup){
      prevGroup = groupName;
      rows += `<tr class="search-group-row" style="background:#eef1f5;border-top:2px solid #c8d4e0;border-bottom:1px solid #c8d4e0">
        <td colspan="5" style="padding:8px 14px;font-size:13px;font-weight:700">
          <span class="badge ${catCls(a.cat)}" style="margin-right:8px">${a.cat}</span>${groupName}
        </td>
      </tr>`;
    }
    const isFocus = arrivalFocus && a.pid === arrivalFocus.pid;
    rows += `<tr class="search-row" style="border-bottom:1px solid var(--border);${isFocus?'background:var(--green-bg)':''}" onmouseover="this.style.background='var(--blue-bg)'" onmouseout="this.style.background='${isFocus?'var(--green-bg)':''}'">
      <td data-label="貨號" style="padding:10px 8px;font-family:ui-monospace,monospace;font-weight:700;color:var(--blue);font-size:16px;white-space:nowrap">${a.pid}</td>
      <td data-label="顏色 / 規格" style="padding:10px 8px;color:var(--gray);font-size:13px;white-space:nowrap">${detail}</td>
      ${qtyCell(a.qty[0], ARRIVAL_WEEKS[0])}
      ${qtyCell(a.qty[1], ARRIVAL_WEEKS[1])}
      ${qtyCell(a.qty[2], ARRIVAL_WEEKS[2])}
    </tr>`;
  }

  el.innerHTML = `
    ${focusBar}
    <div style="padding:12px 16px;background:var(--light);border-bottom:1px solid var(--border);font-size:12px;color:var(--gray);font-weight:600">找到 <span style="color:var(--text)">${filtered.length}</span> 筆結果</div>
    <div class="search-table-wrap" style="overflow-x:auto">
      <table class="search-table" style="width:auto;min-width:100%;border-collapse:collapse;font-size:15px">
        <thead>
          <tr style="background:var(--light);border-bottom:1px solid var(--border)">
            <th style="padding:10px 8px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">貨號</th>
            <th style="padding:10px 8px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px">顏色 / 規格</th>
            <th style="padding:10px 14px;text-align:center;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">${ARRIVAL_WEEKS[0]}</th>
            <th style="padding:10px 14px;text-align:center;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">${ARRIVAL_WEEKS[1]}</th>
            <th style="padding:10px 14px;text-align:center;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">${ARRIVAL_WEEKS[2]}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}


renderArrivals();
</script>
</body>
</html>

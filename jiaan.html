function getSeries(cat, name){
  if(cat==='Mac'){
    if(name.startsWith('MacBook Air')) return 'MacBook Air';
    if(name.startsWith('MacBook Pro')) return 'MacBook Pro';
    if(name.startsWith('MacBook Neo')) return 'MacBook Neo';
    if(name.startsWith('Mac Mini')) return 'Mac mini';
    if(name.startsWith('Mac Studio')) return 'Mac Studio';
    if(name.startsWith('iMac')) return 'iMac';
  }
  if(cat==='iPad'){
    if(name.startsWith('iPad mini')) return 'iPad mini';
    if(name.startsWith('iPad A16')) return 'iPad A16';
    if(name.startsWith('iPad Pro')) return 'iPad Pro';
    if(name.startsWith('iPad Air')) return 'iPad Air';
  }
  if(cat==='iPhone'){
    if(name.startsWith('iPhone 17e')) return 'iPhone 17e';
    if(name.startsWith('iPhone 17 Pro Max')) return 'iPhone 17 Pro Max';
    if(name.startsWith('iPhone 17 Pro')) return 'iPhone 17 Pro';
    if(name.startsWith('iPhone 17')) return 'iPhone 17';
    if(name.startsWith('iPhone Air')) return 'iPhone Air';
    if(name.startsWith('iPhone 16e')) return 'iPhone 16e';
    if(name.startsWith('iPhone 16 Plus')) return 'iPhone 16 Plus';
    if(name.startsWith('iPhone 16')) return 'iPhone 16';
  }
  if(cat==='Watch'){
    if(name.includes('SE3')) return 'Apple Watch SE3';
    if(name.includes('Ultra 3')) return 'Apple Watch Ultra 3';
    if(name.includes('S11')) return 'Apple Watch S11';
  }
  return null;
}

function getSubOptions(cat){
  if(cat==='配件') return ACCESSORY_GROUP_ORDER;
  if(cat==='Mac'||cat==='iPad'||cat==='iPhone'||cat==='Watch'){
    const seen = new Set(), out = [];
    for(const p of PRODUCTS){
      if(p.cat!==cat) continue;
      if(searchSeries!=='all' && getSeries(p.cat,p.name)!==searchSeries) continue;
      if(!seen.has(p.name)){ seen.add(p.name); out.push(p.name); }
    }
    return out;
  }
  return null;
}
function matchesSeries(p){
  if(searchSeries==='all') return true;
  return getSeries(p.cat, p.name) === searchSeries;
}
function matchesSub(p){
  if(searchSub==='all') return true;
  if(p.cat==='配件') return (ACCESSORY_GROUP[p.name]||'其他') === searchSub;
  return p.name === searchSub;
}
function selectCat(c){
  searchCat = c;
  searchSeries = 'all';
  searchSub = 'all';
  renderSeriesMenu();
  renderSubMenu();
  updateSearchResults();
}
function selectSeries(s){
  searchSeries = s;
  searchSub = 'all';
  renderSeriesMenu();
  renderSubMenu();
  updateSearchResults();
}
function selectSub(s){
  searchSub = s;
  renderSubMenu();
  updateSearchResults();
}
function renderSeriesMenu(){
  const el = document.getElementById('series-row');
  if(!el) return;
  const list = SERIES_ORDER[searchCat];
  el.innerHTML = '';
  if(!list){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const opts = ['all', ...list];
  for(const s of opts){
    const btn = document.createElement('button');
    btn.className = 'series-btn';
    btn.textContent = s === 'all' ? '全部系列' : s;
    const on = s === searchSeries;
    btn.style.cssText = `padding:4px 12px;border-radius:16px;border:1.5px solid ${on?'var(--blue)':'var(--border)'};background:${on?'var(--blue-bg)':'var(--white)'};color:${on?'var(--blue)':'var(--gray)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .13s`;
    btn.addEventListener('click', () => selectSeries(s));
    el.appendChild(btn);
  }
}
function renderSubMenu(){
  const el = document.getElementById('sub-cat-row');
  if(!el) return;
  const subs = getSubOptions(searchCat);
  el.innerHTML = '';
  if(!subs){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const opts = ['all', ...subs];
  for(const s of opts){
    const btn = document.createElement('button');
    btn.className = 'sub-cat-btn';
    btn.textContent = s === 'all' ? '全部' : s;
    const on = s === searchSub;
    btn.style.cssText = `padding:4px 12px;border-radius:16px;border:1.5px solid ${on?'var(--green)':'var(--border)'};background:${on?'var(--green-bg)':'var(--white)'};color:${on?'var(--green)':'var(--gray)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .13s`;
    btn.addEventListener('click', () => selectSub(s));
    el.appendChild(btn);
  }
}

      <td data-label="顏色" style="padding:10px 8px;white-space:nowrap">${p.color||'—'}</td>
      <td data-label="規格" style="padding:10px 8px;white-space:nowrap;color:var(--gray);font-size:13px">${p.spec}</td>
      <td data-label="售價" style="padding:10px 8px;text-align:left;font-weight:600;white-space:nowrap">$${p.price.toLocaleString()}</td>
      <td data-label="活動折扣" style="padding:10px 4px 10px 8px;text-align:left;font-weight:700;width:90px;max-width:90px;white-space:normal;${actStyle}">${actVal}${otherTag}</td>
      <td data-label="促銷價(未含教育折扣)" style="padding:10px 8px 10px 4px;text-align:left;white-space:nowrap">${promo!=null?`<span style="display:inline-block;padding:3px 9px;border-radius:6px;background:var(--green-bg);color:var(--green);font-weight:700;font-size:14px">$${promo.toLocaleString()}</span>`:'<span style="color:var(--border)">—</span>'}</td>
      <td data-label="贈品" style="padding:10px 8px;font-size:13px;color:var(--text)">${act?.g||'—'}</td>
      <td data-label="教育折抵" style="padding:10px 8px;text-align:left;font-weight:700;white-space:nowrap;${edu?'color:var(--red)':'color:var(--border)'}">${edu?'-$'+edu.toLocaleString():'—'}</td>
    </tr>`;
  }

  el.innerHTML = `
    <div style="padding:12px 16px;background:var(--light);border-bottom:1px solid var(--border);font-size:12px;color:var(--gray);font-weight:600">找到 <span style="color:var(--text)">${filtered.length}</span> 筆結果</div>
    <div class="search-table-wrap" style="overflow-x:auto">
      <table class="search-table" style="width:auto;min-width:100%;border-collapse:collapse;font-size:15px">
        <thead>
          <tr style="background:var(--light);border-bottom:1px solid var(--border)">
            <th class="search-thead-th" style="padding:10px 8px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">貨號</th>
            <th class="search-thead-th" style="padding:10px 8px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">顏色</th>
            <th class="search-thead-th" style="padding:10px 8px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px">規格</th>
            <th class="search-thead-th" style="padding:10px 8px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">售價</th>
            <th class="search-thead-th" style="padding:10px 4px 10px 8px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;width:90px;max-width:90px">活動折扣</th>
            <th class="search-thead-th" style="padding:10px 8px 10px 4px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">促銷價<br><span style="font-size:9px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--gray)">未含教育折扣</span></th>
            <th class="search-thead-th" style="padding:10px 8px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">贈品</th>
            <th class="search-thead-th" style="padding:10px 8px;text-align:left;font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">教育折抵</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderSearch(){
  const cats = ['all','Mac','iPad','iPhone','Watch','配件','軟體'];
  const catLabels = {all:'全部',Mac:'Mac',iPad:'iPad',iPhone:'iPhone',Watch:'Watch',配件:'配件',軟體:'軟體'};

  document.getElementById('mc').innerHTML = `
    <div class="sec-hdr"><div><div class="sec-title">激安活動</div><div class="sec-sub">共 ${PRODUCTS.length} 筆資料 · 來源：202608激安操盤.pdf（永二・新光華・澄清文山）</div></div></div>
    <div class="card" style="padding:14px 20px;margin-bottom:14px;background:#fff7f0;border:1.5px solid #f3c8a0;font-size:12.5px;line-height:1.8;color:#8a4a1e">
      <b>活動注意事項：</b>客製機款不參與活動；活動不與出清價格、其他操盤並行；活動可搭配舊換新折抵；教育價可全額並行優惠（需未被禁止）；限制每人每卡二台，不接大宗採購。iPhone/iPad/Mac客訂皆無交貨日期，依客訂順序出貨，請勿壓交期。<br>
      <b>舊換新加碼：</b>舊換新回收最高折抵金額 +15%，優惠折抵加碼價格僅保留三天，成功回收關鍵在多問一句。<br>
      <b>原副廠配件：</b>原廠配件、副廠配件全系列原會員價 9 折（優惠價不可並行；本表無會員價資料，未列入下方逐貨號折扣試算）。<br>
      <b>展示機出清另計：</b>展-iPhone 16e 128GB（貨號811928）$11,900、展-15.3吋MBA M3/8CPU/10GPU/16G（貨號811642）$24,900，為門市展示機出清特例，非本表一般貨號，數量有限售完為止。<br>
      <b>本表未列入折扣的系列</b>（iPhone 16e、Mac Studio、一般原廠/副廠配件、軟體）不參與本次激安活動，僅顯示原價。
    </div>
    <div class="card" style="padding:16px 20px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        ${ACTIVITY_PERIOD_ORDER.map(k=>`<button onclick="searchPeriod='${k}';updateSearchResults()" style="padding:.4em .9em;font-size:.85em;font-weight:700;border:1.5px solid ${k===searchPeriod?ACTIVITY_PERIODS[k].color:'var(--border)'};border-radius:20px;background:${k===searchPeriod?ACTIVITY_PERIODS[k].color:'var(--white)'};color:${k===searchPeriod?'#fff':'var(--gray)'};cursor:pointer;white-space:nowrap">${ACTIVITY_PERIODS[k].label}</button>`).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
        <input id="sq" type="search" value="${searchQuery.replace(/"/g,'&quot;')}" placeholder="輸入關鍵字：貨號 / 型號 / 品名 / 規格 / 顏色 / 價格…" autocomplete="off"
          style="flex:1;min-width:200px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:16px;font-family:inherit;outline:none;background:var(--light)"
          oninput="searchQuery=this.value;updateSearchResults()" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
        <button onclick="searchQuery='';document.getElementById('sq').value='';updateSearchResults()" style="padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:13px;cursor:pointer;font-family:inherit;color:var(--gray)">清除</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${cats.map(c=>`<button class="cat-btn" data-cat="${c}" onclick="selectCat('${c}')" style="padding:5px 14px;border-radius:20px;border:1.5px solid ${searchCat===c?'var(--blue)':'var(--border)'};background:${searchCat===c?'var(--blue)':'var(--white)'};color:${searchCat===c?'#fff':'var(--gray)'};font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .13s">${catLabels[c]}</button>`).join('')}
      </div>
      <div id="series-row" style="display:none;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)"></div>
      <div id="sub-cat-row" style="display:none;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)"></div>
    </div>
    <div id="search-results" class="card" style="padding:0;overflow:hidden"></div>`;

  renderSeriesMenu();
  renderSubMenu();
  updateSearchResults();
}

renderSearch();
</script>
</body>
</html>
